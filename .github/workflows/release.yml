name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $project = [xml](Get-Content -LiteralPath Directory.Build.props -Raw)
          $version = $project.Project.PropertyGroup.VersionPrefix | Select-Object -First 1
          if ('${{ github.ref_name }}' -ne "v$version") {
            throw "Tag '${{ github.ref_name }}' does not match VersionPrefix '$version'."
          }
      - name: Build and verify release
        shell: pwsh
        run: .\build.ps1 -Configuration Release -BuildMsi $true
      - name: Preserve release artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: resodrive-${{ github.ref_name }}
          path: |
            artifacts/win-x64/*.zip
            artifacts/win-x64/*.zip.sha256
            artifacts/win-x64/*.msi
            artifacts/win-x64/*.msi.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath artifacts\win-x64 -File |
            Where-Object Name -Match '\.(zip|msi)(\.sha256)?$' |
            Sort-Object Name
          if ($assets.Count -ne 4) {
            throw "Expected four release files, found $($assets.Count)."
          }
          gh release create '${{ github.ref_name }}' $assets.FullName `
            --verify-tag --generate-notes --title 'ResoDrive ${{ github.ref_name }}'
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed with exit code $LASTEXITCODE."
          }
